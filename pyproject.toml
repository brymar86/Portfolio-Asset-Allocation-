[project]
name = "portfolio-construction-ml"
version = "0.1.0"
description = "Portfolio Construction Research using Machine Learning - Advanced portfolio optimization methods including Hierarchical Risk Parity (HRP), Risk Parity, and Nested Clustered Optimization (NCO) based on the work of Marcos Lopez de Prado"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arch>=8.0.0",
    "cvxpy>=1.7.5",
    "fredapi>=0.5.2",
    "joblib>=1.5.2",
    "jupyter>=1.1.1",
    "langchain>=1.1.2",
    "langgraph>=1.0.4",
    "matplotlib>=3.10.7",
    "networkx>=3.6",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "plotly>=6.5.0",
    "pymc>=5.26.1",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.2",
    "quantstats>=0.0.77",
    "requests>=2.32.5",
    "riskfolio-lib>=7.1.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "spyder-kernels>=3.0.0",
    "statsmodels>=0.14.6",
    "tqdm>=4.67.1",
    "vectorbt>=0.28.1",
    "xlsxwriter>=3.2.9",
    "yfinance>=0.2.66",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]

[tool.ruff]
# Ignore E402 (module level import not at top of file) for notebooks
# This is common and acceptable in Jupyter notebooks where imports
# may be done in the middle of cells for demonstration purposes
extend-ignore = ["E402"]

[tool.ruff.per-file-ignores]
# Allow imports anywhere in notebook cells
"*.ipynb" = ["E402"]
